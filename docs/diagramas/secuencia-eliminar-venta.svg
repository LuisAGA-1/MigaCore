" width="14" height="760" rx="0" fill="#fff" stroke="#333333" stroke-width="1.3"/><rect x="853" y="360" width="14" height="510" rx="0" fill="#fff" stroke="#333333" stroke-width="1.3"/><polyline points="90,160 323,160" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#flecha)"/><text x="206.5" y="154" font-size="12" text-anchor="middle" fill="#333333">1: seleccionarVenta(v) en el historial</text><polyline points="90,200 323,200" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#flecha)"/><text x="206.5" y="194" font-size="12" text-anchor="middle" fill="#333333">2: clic &quot;Eliminar venta seleccionada&quot;</text><polyline points="337,222 371,222 371,242 339,242" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#flecha)"/><text x="379" y="236" font-size="12" text-anchor="start" fill="#333333">3: PedirMotivo(resumen)</text><polyline points="90,280 323,280" fill="none" stroke="#333333" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#abierta)"/><text x="206.5" y="274" font-size="12" text-anchor="middle" fill="#333333" font-style="italic">motivo (obligatorio)</text><rect x="40" y="296" width="1280" height="52" rx="0" fill="none" stroke="#555" stroke-width="1.2"/><path d="M40,296 h56 v14 l-8,8 h-48 z" fill="#eee" stroke="#555" stroke-width="1.2"/><text x="46" y="311" font-size="12" text-anchor="start" fill="#333333" font-weight="bold">alt</text><text x="104" y="311" font-size="12" text-anchor="start" fill="#333333">[canceló o sin motivo]</text><text x="330" y="334" font-size="12" text-anchor="middle" fill="#555" font-style="italic">termina sin cambios</text><polyline points="337,372 853,372" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#flecha)"/><text x="595.0" y="366" font-size="12" text-anchor="middle" fill="#333333">4: EliminarVenta(Id_venta, motivo)</text><polyline points="853,406 580,406" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#flecha)"/><text x="716.5" y="400" font-size="12" text-anchor="middle" fill="#333333">5: EsAdmin</text><polyline points="580,432 853,432" fill="none" stroke="#333333" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#abierta)"/><text x="716.5" y="426" font-size="12" text-anchor="middle" fill="#333333" font-style="italic">bool</text><rect x="260" y="446" width="1060" height="70" rx="0" fill="none" stroke="#555" stroke-width="1.2"/><path d="M260,446 h56 v14 l-8,8 h-48 z" fill="#eee" stroke="#555" stroke-width="1.2"/><text x="266" y="461" font-size="12" text-anchor="start" fill="#333333" font-weight="bold">alt</text><text x="324" y="461" font-size="12" text-anchor="start" fill="#333333">[no es Administrador]</text><polyline points="853,492 337,492" fill="none" stroke="#333333" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#abierta)"/><text x="595.0" y="486" font-size="12" text-anchor="middle" fill="#333333" font-style="italic">UnauthorizedAccessException → aviso</text><polyline points="867,546 1210,546" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#flecha)"/><text x="1038.5" y="540" font-size="12" text-anchor="middle" fill="#333333">6: BEGIN</text><polyline points="867,578 1210,578" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#flecha)"/><text x="1038.5" y="572" font-size="12" text-anchor="middle" fill="#333333">7: SELECT producto_id, cantidad FROM detalle_ventas</text><polyline points="1210,604 867,604" fill="none" stroke="#333333" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#abierta)"/><text x="1038.5" y="598" font-size="12" text-anchor="middle" fill="#333333" font-style="italic">detalles</text><polyline points="867,636 1210,636" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#flecha)"/><text x="1038.5" y="630" font-size="12" text-anchor="middle" fill="#333333">8: CalcularConsumo(): SELECT ... FROM recetas</text><polyline points="1210,662 867,662" fill="none" stroke="#333333" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#abierta)"/><text x="1038.5" y="656" font-size="12" text-anchor="middle" fill="#333333" font-style="italic">ingredientes a devolver</text><rect x="700" y="676" width="760" height="92" rx="0" fill="none" stroke="#555" stroke-width="1.2"/><path d="M700,676 h56 v14 l-8,8 h-48 z" fill="#eee" stroke="#555" stroke-width="1.2"/><text x="706" y="691" font-size="12" text-anchor="start" fill="#333333" font-weight="bold">loop</text><text x="764" y="691" font-size="12" text-anchor="start" fill="#333333">[por cada ingrediente de la receta]</text><polyline points="867,722 1210,722" fill="none" stroke="#4F7A28" stroke-width="1.4" marker-end="url(#flechaV)"/><text x="1038.5" y="716" font-size="12" text-anchor="middle" fill="#4F7A28">9: UPDATE ingredientes SET cantidad_disponible + consumo</text><polyline points="867,752 1210,752" fill="none" stroke="#4F7A28" stroke-width="1.4" marker-end="url(#flechaV)"/><text x="1038.5" y="746" font-size="12" text-anchor="middle" fill="#4F7A28">10: INSERT movimientos_inventario (tipo &#x27;Cancelación&#x27;, motivo)</text><polyline points="867,800 1210,800" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#flecha)"/><text x="1038.5" y="794" font-size="12" text-anchor="middle" fill="#333333">11: DELETE detalle_ventas; DELETE ventas</text><polyline points="867,832 1210,832" fill="none" stroke="#333333" stroke-width="1.4" marker-end="url(#flecha)"/><text x="1038.5" y="826" font-size="12" text-anchor="middle" fill="#333333">12: COMMIT</text><polyline points="853,864 337,864" fill="none" stroke="#333333" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#abierta)"/><text x="595.0" y="858" font-size="12" text-anchor="middle" fill="#333333" font-style="italic">ok</text><polyline points="337,880 371,880 371,900 339,900" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#flecha)"/><text x="379" y="894" font-size="12" text-anchor="start" fill="#333333">13: ActualizarReporte()</text><polyline points="323,930 90,930" fill="none" stroke="#333333" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#abierta)"/><text x="206.5" y="924" font-size="12" text-anchor="middle" fill="#333333" font-style="italic">historial sin la venta</text><text x="1210" y="900" font-size="11" text-anchor="middle" fill="#555" font-style="italic">Si algo falla antes del COMMIT, la transacción</text><text x="1210" y="915" font-size="11" text-anchor="middle" fill="#555" font-style="italic">se revierte y la venta no se borra</text><rect x="1340" y="30" width="150" height="54" rx="6" fill="#E4F1D9" stroke="#4F7A28" stroke-width="2"/><text x="1415" y="53" font-size="13" text-anchor="middle" fill="#2F5512" font-weight="bold">NUEVO</text><text x="1415" y="72" font-size="12" text-anchor="middle" fill="#2F5512" font-weight="bold">en el PR #4</text></svg>