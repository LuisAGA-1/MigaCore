</defs><rect width="100%" height="100%" fill="#F9FAFB"/><circle cx="60" cy="130" r="18" fill="#333333"/><polyline points="78,130 120,130" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha)"/><path d="M140,110.0 L160.0,130 L140,150.0 L120.0,130 z" fill="#fff" stroke="#333333" stroke-width="1.6"/><text x="140" y="134.0" font-size="11.5" text-anchor="middle" fill="#333333"></text><polyline points="160,130 200,130" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha)"/><rect x="200.0" y="102.0" width="180" height="56" rx="12" fill="#E6E6E6" stroke="#333333" stroke-width="1.6"/><text x="290" y="127.0" font-size="13" text-anchor="middle" fill="#333333">Escribir usuario</text><text x="290" y="143.0" font-size="13" text-anchor="middle" fill="#333333">y contraseña</text><polyline points="380,130 430,130" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha)"/><path d="M520,85.0 L605.0,130 L520,175.0 L435.0,130 z" fill="#E4F1D9" stroke="#4F7A28" stroke-width="2.2"/><text x="520" y="127.0" font-size="11.5" text-anchor="middle" fill="#2F5512" font-weight="bold">¿Hay conexión con</text><text x="520" y="141.0" font-size="11.5" text-anchor="middle" fill="#2F5512" font-weight="bold">PostgreSQL?</text><text x="580" y="118" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold"></text><polyline points="520,175 520,270" fill="none" stroke="#4F7A28" stroke-width="1.5" marker-end="url(#flechaV)"/><text x="536" y="200" font-size="12" text-anchor="middle" fill="#2F5512" font-weight="bold">No</text><rect x="395.0" y="272.0" width="250" height="76" rx="12" fill="#E4F1D9" stroke="#4F7A28" stroke-width="2.2"/><text x="520" y="299.0" font-size="13" text-anchor="middle" fill="#2F5512" font-weight="bold">Mostrar &quot;No hay conexión con</text><text x="520" y="315.0" font-size="13" text-anchor="middle" fill="#2F5512" font-weight="bold">la base de datos&quot; y guardar</text><text x="520" y="331.0" font-size="13" text-anchor="middle" fill="#2F5512" font-weight="bold">errores.log</text><polyline points="395,310 140,310 140,150" fill="none" stroke="#4F7A28" stroke-width="1.5" marker-end="url(#flechaV)"/><polyline points="605,130 660,130" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha)"/><text x="630" y="120" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold">Sí</text><path d="M750,85.0 L835.0,130 L750,175.0 L665.0,130 z" fill="#fff" stroke="#333333" stroke-width="1.6"/><text x="750" y="127.0" font-size="11.5" text-anchor="middle" fill="#333333">¿Usuario activo y</text><text x="750" y="141.0" font-size="11.5" text-anchor="middle" fill="#333333">contraseña correcta?</text><polyline points="750,175 750,270" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha)"/><text x="764" y="200" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold">No</text><rect x="650.0" y="272.0" width="200" height="56" rx="12" fill="#E6E6E6" stroke="#333333" stroke-width="1.6"/><text x="750" y="297.0" font-size="13" text-anchor="middle" fill="#333333">Mostrar &quot;Usuario o</text><text x="750" y="313.0" font-size="13" text-anchor="middle" fill="#333333">contraseña incorrectos&quot;</text><polyline points="750,328 750,400 110,400 110,130 120,130" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha)"/><polyline points="835,130 890,130" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha)"/><text x="862" y="120" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold">Sí</text><path d="M980,85.0 L1065.0,130 L980,175.0 L895.0,130 z" fill="#E4F1D9" stroke="#4F7A28" stroke-width="2.2"/><text x="980" y="127.0" font-size="11.5" text-anchor="middle" fill="#2F5512" font-weight="bold">¿Contraseña</text><text x="980" y="141.0" font-size="11.5" text-anchor="middle" fill="#2F5512" font-weight="bold">temporal?</text><text x="1000" y="78" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold"></text><polyline points="980,175 980,250" fill="none" stroke="#4F7A28" stroke-width="1.5" marker-end="url(#flechaV)"/><text x="994" y="200" font-size="12" text-anchor="middle" fill="#2F5512" font-weight="bold">Sí</text><rect x="865.0" y="255.0" width="230" height="70" rx="12" fill="#E4F1D9" stroke="#4F7A28" stroke-width="2.2"/><text x="980" y="279.0" font-size="13" text-anchor="middle" fill="#2F5512" font-weight="bold">Pedir nueva contraseña</text><text x="980" y="295.0" font-size="13" text-anchor="middle" fill="#2F5512" font-weight="bold">(mínimo 6 caracteres,</text><text x="980" y="311.0" font-size="13" text-anchor="middle" fill="#2F5512" font-weight="bold">confirmada y distinta)</text><polyline points="980,325 980,375" fill="none" stroke="#4F7A28" stroke-width="1.5" marker-end="url(#flechaV)"/><path d="M980,375.0 L1065.0,420 L980,465.0 L895.0,420 z" fill="#E4F1D9" stroke="#4F7A28" stroke-width="2.2"/><text x="980" y="417.0" font-size="11.5" text-anchor="middle" fill="#2F5512" font-weight="bold">¿Cumple las</text><text x="980" y="431.0" font-size="11.5" text-anchor="middle" fill="#2F5512" font-weight="bold">reglas?</text><polyline points="895,420 860,420 860,290 865,290" fill="none" stroke="#4F7A28" stroke-width="1.5" marker-end="url(#flechaV)"/><text x="880" y="412" font-size="12" text-anchor="middle" fill="#2F5512" font-weight="bold">No</text><text x="800" y="470" font-size="11" text-anchor="middle" fill="#2F5512" font-style="italic">muestra el error y vuelve a pedirla</text><polyline points="1065,420 1130,420" fill="none" stroke="#4F7A28" stroke-width="1.5" marker-end="url(#flechaV)"/><text x="1095" y="410" font-size="12" text-anchor="middle" fill="#2F5512" font-weight="bold">Sí</text><rect x="1130.0" y="390.0" width="200" height="60" rx="12" fill="#E4F1D9" stroke="#4F7A28" stroke-width="2.2"/><text x="1230" y="417.0" font-size="13" text-anchor="middle" fill="#2F5512" font-weight="bold">Guardar contraseña</text><text x="1230" y="433.0" font-size="13" text-anchor="middle" fill="#2F5512" font-weight="bold">(hash) y quitar la marca</text><text x="1110" y="262" font-size="11" text-anchor="start" fill="#2F5512" font-style="italic">Si cierra la ventana:</text><text x="1110" y="277" font-size="11" text-anchor="start" fill="#2F5512" font-style="italic">no entra y vuelve al login</text><polyline points="1230,390 1230,150" fill="none" stroke="#4F7A28" stroke-width="1.5" marker-end="url(#flechaV)"/><polyline points="1065,130 1210,130" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha)"/><text x="1100" y="120" font-size="12" text-anchor="middle" fill="#333333" font-weight="bold">No</text><path d="M1230,110.0 L1250.0,130 L1230,150.0 L1210.0,130 z" fill="#fff" stroke="#333333" stroke-width="1.6"/><text x="1230" y="134.0" font-size="11.5" text-anchor="middle" fill="#333333"></text><polyline points="1250,130 1300,130" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha)"/><rect x="1305.0" y="98.0" width="190" height="64" rx="12" fill="#E6E6E6" stroke="#333333" stroke-width="1.6"/><text x="1400" y="127.0" font-size="13" text-anchor="middle" fill="#333333">Abrir MigaCore con</text><text x="1400" y="143.0" font-size="13" text-anchor="middle" fill="#333333">el menú según el rol</text><polyline points="1495,130 1545,130" fill="none" stroke="#333333" stroke-width="1.5" marker-end="url(#flecha)"/><circle cx="1565" cy="130" r="19" fill="#fff" stroke="#333333" stroke-width="2"/><circle cx="1565" cy="130" r="12" fill="#333333"/><rect x="1360" y="440" width="34" height="18" rx="0" fill="#E6E6E6" stroke="#333333" stroke-width="1.5"/><text x="1406" y="454" font-size="12" text-anchor="start" fill="#333333">Sin cambios (ya estaba en el diagrama)</text><rect x="1360" y="468" width="34" height="18" rx="0" fill="#E4F1D9" stroke="#4F7A28" stroke-width="2"/><text x="1406" y="482" font-size="12" text-anchor="start" fill="#2F5512" font-weight="bold">Nuevo en el PR #4</text><rect x="1360" y="496" width="34" height="18" rx="0" fill="#FCEFD6" stroke="#B9771E" stroke-width="2"/><text x="1406" y="510" font-size="12" text-anchor="start" fill="#7A4A0E" font-weight="bold">Corregido en el PR #4</text><path d="M1377,523.0 L1389.0,533 L1377,543.0 L1365.0,533 z" fill="#fff" stroke="#333333" stroke-width="1.6"/><text x="1377" y="537.0" font-size="11.5" text-anchor="middle" fill="#333333"></text><text x="1406" y="538" font-size="12" text-anchor="start" fill="#333333">Nodo de unión (merge)</text></svg>