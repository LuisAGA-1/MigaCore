<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="600" viewBox="0 0 1700 600" font-family="DejaVu Sans, Arial, sans-serif"><title>Diagrama de actividad: Iniciar sesión (corregido tras el PR #4)</title><defs>
